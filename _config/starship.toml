# Minimal prompt emulating the old oh-my-zsh "arrow" theme
# Shows: directory ➤  (with git branch on the right)

command_timeout = 5000
add_newline = false

format = """$directory$character"""
right_format = """$cmd_duration$git_branch"""

[character]
success_symbol = "[➤](bold yellow)"
error_symbol = "[➤](bold red)"

[directory]
truncation_length = 1
truncate_to_repo = false
style = "bold yellow"
format = "[$path]($style) "

[cmd_duration]
min_time = 3000
format = "[$duration]($style) "
style = "bold yellow"

[git_branch]
format = "[$branch]($style)"
style = "bold green"
