# vim:ft=tmux

# Terminal {{{

set-option -sa terminal-overrides ',xterm-256color:RGB'
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
bind -n S-Enter send-keys Escape '[13;2u'
set -g default-command '/opt/homebrew/bin/zsh -l'

# }}}

# Sensible defaults {{{

set -s escape-time 0
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g status-keys emacs
set -g focus-events on
setw -g aggressive-resize on
setw -g mode-keys vi

# }}}

# Windows and panes {{{

# preserve working directory
bind-key c new-window -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"

# auto-rename windows, set terminal titles
set-window-option -g automatic-rename on
set-option -g set-titles on
set-option -g set-titles-string "#I:#W"
set-option -g renumber-windows on

# }}}

# Navigation {{{

# vim-style pane selection
bind-key h select-pane -L
bind-key l select-pane -R
bind-key j select-pane -D
bind-key k select-pane -U

# resize panes
bind-key C-j resize-pane -D 8
bind-key C-k resize-pane -U 8
bind-key C-h resize-pane -L 8
bind-key C-l resize-pane -R 8

# next/prev window
bind-key n prev
bind-key p next

# move pane to nearby window
bind-key P joinp -t:+
bind-key N joinp -t:-

# swap windows left/right
bind-key C-n swap-window -t -1
bind-key C-p swap-window -t +1

# }}}

# Shortcuts {{{

# toggle pane synchronization
bind-key S setw synchronize-panes
# tiled layout
bind-key T select-layout tiled
# clear Claude attention marker from window title
bind-key C-b run-shell 'TMUX_PANE="#{pane_id}" ~/.claude/hooks/clear-attention.sh'

# }}}

# Clipboard {{{

bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# }}}

# Nord theme {{{

set -g status on
set -g status-justify left
set -g status-style bg=black,fg=white
set -g status-left "#[fg=black,bg=blue,bold] #S #[fg=blue,bg=black,nobold,noitalics,nounderscore]"
set -g status-right "#[fg=brightblack,bg=black,nobold,noitalics,nounderscore]#[fg=white,bg=brightblack] %Y-%m-%d #[fg=white,bg=brightblack,nobold,noitalics,nounderscore]#[fg=white,bg=brightblack] %H:%M #[fg=cyan,bg=brightblack,nobold,noitalics,nounderscore]#[fg=black,bg=cyan,bold] #H "
set -g window-status-format "#[fg=black,bg=brightblack,nobold,noitalics,nounderscore] #[fg=white,bg=brightblack]#I #[fg=white,bg=brightblack,nobold,noitalics,nounderscore] #[fg=white,bg=brightblack]#W #F #[fg=brightblack,bg=black,nobold,noitalics,nounderscore]"
set -g window-status-current-format "#[fg=black,bg=cyan,nobold,noitalics,nounderscore] #[fg=black,bg=cyan]#I #[fg=black,bg=cyan,nobold,noitalics,nounderscore] #[fg=black,bg=cyan]#W #F #[fg=cyan,bg=black,nobold,noitalics,nounderscore]"
set -g window-status-separator ""
set -g pane-border-style bg=default,fg=brightblack
set -g pane-active-border-style bg=default,fg=blue
set -g display-panes-colour black
set -g display-panes-active-colour brightblack
setw -g clock-mode-colour cyan
set -g message-style bg=brightblack,fg=cyan
set -g message-command-style bg=brightblack,fg=cyan

# }}}
